name: Build
on:
  push:
    branches: [main, feat/palette-shuffle]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: palette-shuffle-26.3
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: build/reports/tests/
  client-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl-mesa0 mesa-vulkan-drivers libvulkan1
      - run: xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX +render -noreset' bash ./gradlew runClientGameTest
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-test-results
          path: |
            build/run/**/screenshots/*.png
            build/run/**/logs/latest.log
            build/run/**/crash-reports/*.txt
          if-no-files-found: ignore
